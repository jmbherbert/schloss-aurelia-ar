<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Schloss Aurelia — Interactive 3D, iPhone &amp; Android AR Castle Diorama</title>
  <meta name="description" content="Explore Schloss Aurelia — a 255-tree fairytale island citadel modeled in Blender via an AI Modeler + Critic loop. Orbit in 3D or place on your table in iPhone &amp; Android AR." />

  <!-- Open Graph / X (Twitter) Large Preview Card Tags -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://jmbherbert.github.io/schloss-aurelia-ar/" />
  <meta property="og:title" content="Schloss Aurelia — 3D Fairytale Citadel &amp; Tabletop AR Diorama" />
  <meta property="og:description" content="Generated in 2D, reconstructed in 3D Blender via an iterative Modeler + Critic loop, and exported to interactive WebGL + iPhone &amp; Android AR." />
  <meta property="og:image" content="https://jmbherbert.github.io/schloss-aurelia-ar/og_card_1200x630.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Schloss Aurelia — 3D Fairytale Citadel &amp; Tabletop AR Diorama" />
  <meta name="twitter:description" content="Tap on iPhone or Android to place the animated 92 cm forested castle diorama right on your desk in AR, or orbit in 3D WebGL." />
  <meta name="twitter:image" content="https://jmbherbert.github.io/schloss-aurelia-ar/og_card_1200x630.jpg" />

  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    :root {
      --bg-top: #0c1829;
      --bg-mid: #132744;
      --bg-bot: #050a12;
      --glass: rgba(10, 18, 34, 0.84);
      --glass-border: rgba(242, 194, 82, 0.30);
      --gold: #f5c654;
      --gold-deep: #d48a17;
      --turquoise: #26cbe8;
      --text: #f8fafc;
      --muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 36%, var(--bg-mid) 0%, var(--bg-top) 54%, var(--bg-bot) 100%);
      color: var(--text);
    }

    .app-shell {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    model-viewer#castleViewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      --progress-bar-color: #f5c654;
      --progress-bar-height: 3px;
      outline: none;
    }

    /* Hide <model-viewer>'s duplicate floating AR button so it never collides with our unified dock CTA on iOS/Android */
    .mv-ar-hidden-slot {
      display: none !important;
    }

    .top-bar {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.42);
      z-index: 10;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: #fff8e7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 11.5px;
      line-height: 1.2;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .dl-link {
      display: inline-flex;
      align-items: center;
      height: 30px;
      gap: 5px;
      padding: 0 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      text-decoration: none;
      color: #fef3c7;
      background: rgba(245, 198, 84, 0.14);
      border: 1px solid rgba(245, 198, 84, 0.38);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .dl-link:hover, .dl-link:active {
      background: rgba(245, 198, 84, 0.28);
      transform: translateY(-1px);
    }

    .bottom-dock {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: max(10px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.52);
      z-index: 10;
    }

    .preset-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-right: 18px;
      -webkit-mask-image: linear-gradient(to right, #000 0%, #000 90%, transparent 100%);
      mask-image: linear-gradient(to right, #000 0%, #000 90%, transparent 100%);
    }

    .preset-strip::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      height: 30px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(15, 23, 42, 0.72);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip.active {
      background: rgba(38, 203, 232, 0.22);
      border-color: rgba(38, 203, 232, 0.78);
      color: #ecfeff;
    }

    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: nowrap;
    }

    /* Wrapper keeps visual gold pill (pointer-events: none) separate from pure single-child <a rel="ar"><img/></a> hit layer! */
    .ar-cta-wrap {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      height: 42px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(214, 140, 20, 0.34);
    }

    .ar-cta-visual {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f7ce65 0%, #da8e18 100%);
      color: #171105;
      font-size: 13.5px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      border: 1px solid rgba(255, 247, 214, 0.80);
      pointer-events: none;
    }

    .ar-cta-visual img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
    }

    .ar-cta-visual span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Pure single-child Apple Safari <a rel="ar"><img/></a> hit layer (MUST contain ONLY <img> with zero sibling elements/text!) */
    a.ios-pure-ar-hit {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0.005;
      cursor: pointer;
    }

    a.ios-pure-ar-hit img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 0;
    }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 42px;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.32);
      background: rgba(30, 41, 59, 0.78);
      color: #f1f5f9;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }

    .toggle-btn.on {
      border-color: rgba(245, 198, 84, 0.65);
      color: #fde68a;
      background: rgba(245, 198, 84, 0.15);
    }

    .toggle-icon {
      font-size: 14px;
      line-height: 1;
    }

    /* Sleek banner shown ONLY when opened inside X / Instagram / LinkedIn iOS in-app WKWebView */
    .inapp-safari-hint {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 11px;
      border-radius: 11px;
      background: rgba(245, 198, 84, 0.16);
      border: 1px solid rgba(245, 198, 84, 0.55);
      color: #fef3c7;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.3;
    }

    .inapp-safari-hint.show {
      display: flex;
    }

    /* Mobile Portrait Optimization (iPhone & Android) */
    @media (max-width: 600px) {
      .top-bar {
        padding: 9px 13px;
      }
      /* Hide raw developer file-download pills on small mobile screens so title & subtitle never truncate */
      .badge-row {
        display: none;
      }
      .brand-title {
        font-size: 14.5px;
      }
      .brand-sub {
        font-size: 11px;
      }
      .bottom-dock {
        padding: 9px 10px;
        gap: 7px;
      }
      .ar-cta-visual {
        font-size: 13px;
        padding: 0 11px;
        gap: 7px;
      }
      .toggle-btn {
        width: 42px;
        padding: 0;
      }
      .toggle-text {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <div class="brand-title">🏰 Schloss Aurelia — Sunspire Citadel</div>
        <div class="brand-sub">92 cm Tabletop AR Diorama • 255 Trees • Weathered PBR</div>
      </div>
      <div class="badge-row">
        <a class="dl-link" href="./schloss_aurelia_ar.usdz" download="schloss_aurelia_ar.usdz">⬇️ USDZ (9.9 MB)</a>
        <a class="dl-link" href="./schloss_aurelia_ar.glb" download="schloss_aurelia_ar.glb">⬇️ GLB (8.9 MB)</a>
      </div>
    </header>

    <model-viewer
      id="castleViewer"
      src="./schloss_aurelia_ar.glb"
      ios-src="./schloss_aurelia_ar.usdz"
      poster="./poster_hero.jpg"
      alt="Schloss Aurelia — 3D Enchanted Fairytale Castle Diorama surrounded by a 255-tree Alpine Pine and Cherry Blossom Forest and Sapphire Moat"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="auto"
      ar-placement="floor"
      camera-controls
      touch-action="none"
      autoplay
      auto-rotate
      auto-rotate-delay="2000"
      rotation-per-second="9deg"
      interaction-prompt="none"
      tone-mapping="agx"
      shadow-intensity="1.35"
      shadow-softness="0.65"
      exposure="0.82"
      environment-image="legacy"
      camera-target="0m 0.095m 0.01m"
      camera-orbit="26deg 65deg 0.88m"
      min-camera-orbit="auto 12deg 0.22m"
      max-camera-orbit="auto 87deg 2.80m"
      field-of-view="35deg">
      <button slot="ar-button" class="mv-ar-hidden-slot" aria-hidden="true" tabindex="-1"></button>
    </model-viewer>

    <footer class="bottom-dock">
      <div class="inapp-safari-hint" id="inappHint">
        <span id="inappHintText">🧭 In-app browser blocks Apple AR — tap below or tap <b>Safari</b> (bottom-right) ↗</span>
      </div>
      <div class="preset-strip" id="presetStrip">
        <button class="chip active" data-orbit="26deg 65deg 0.88m" data-orbit-mobile="26deg 62deg 1.16m" data-target="0m 0.095m 0.01m" data-target-mobile="0m 0.046m 0.01m">✨ Castle Hero 3/4</button>
        <button class="chip" data-orbit="22deg 54deg 1.34m" data-orbit-mobile="22deg 52deg 1.66m" data-target="0m 0.065m 0m" data-target-mobile="0m 0.025m 0m">🌲 Full Forest</button>
        <button class="chip" data-orbit="-4deg 73deg 0.72m" data-orbit-mobile="-4deg 71deg 0.96m" data-target="-0.02m 0.08m 0.05m" data-target-mobile="-0.02m 0.048m 0.04m">🌉 Causeway</button>
        <button class="chip" data-orbit="-62deg 67deg 0.74m" data-orbit-mobile="-62deg 65deg 0.98m" data-target="-0.08m 0.085m 0.02m" data-target-mobile="-0.06m 0.052m 0.02m">🌊 Waterfall</button>
        <button class="chip" data-orbit="76deg 66deg 0.78m" data-orbit-mobile="76deg 64deg 1.02m" data-target="0.06m 0.11m 0.01m" data-target-mobile="0.05m 0.072m 0.01m">🔭 Celestial Spire</button>
        <button class="chip" data-orbit="8deg 22deg 1.48m" data-orbit-mobile="8deg 24deg 1.78m" data-target="0m 0.05m 0m" data-target-mobile="0m 0.020m 0m">🦅 Aerial</button>
      </div>
      <div class="action-row">
        <div class="ar-cta-wrap">
          <div class="ar-cta-visual" aria-hidden="true">
            <img src="./poster_hero.jpg" alt="" />
            <span id="arQuickLabel">📲 Place on Table in iPhone AR</span>
          </div>
          <a rel="ar" id="arQuickPill" class="ios-pure-ar-hit" href="./schloss_aurelia_ar.usdz"><img src="./poster_hero.jpg" alt="Open in AR Quick Look" /></a>
        </div>
        <div class="toggle-group">
          <button class="toggle-btn on" id="btnSpin" type="button" title="Toggle Turntable Rotation" aria-label="Toggle Turntable Rotation"><span class="toggle-icon">↻</span><span class="toggle-text">Turntable</span></button>
          <button class="toggle-btn on" id="btnAnim" type="button" title="Toggle Scene Animation" aria-label="Toggle Scene Animation"><span class="toggle-icon">⏯</span><span class="toggle-text">Motion</span></button>
        </div>
      </div>
    </footer>
  </div>

  <script>
    const mv = document.getElementById('castleViewer');
    const chips = Array.from(document.querySelectorAll('#presetStrip .chip'));
    const btnSpin = document.getElementById('btnSpin');
    const btnAnim = document.getElementById('btnAnim');
    const arPill = document.getElementById('arQuickPill');
    const arLabel = document.getElementById('arQuickLabel');

    // Auto-frame camera distance & vertical target for narrow portrait mobile screens so the castle sits cleanly above the dock
    function isMobilePortrait() {
      return window.innerWidth <= 600 && window.innerHeight > window.innerWidth;
    }

    function applyChipCamera(chip) {
      const portrait = isMobilePortrait();
      mv.cameraOrbit = (portrait && chip.dataset.orbitMobile) ? chip.dataset.orbitMobile : chip.dataset.orbit;
      mv.cameraTarget = (portrait && chip.dataset.targetMobile) ? chip.dataset.targetMobile : chip.dataset.target;
      mv.fieldOfView = portrait ? '40deg' : '35deg';
    }

    applyChipCamera(chips[0]);

    // Platform-aware AR button routing (detects X / social in-app WKWebView vs real iOS Safari!)
    const ua = navigator.userAgent || '';
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/i.test(ua);
    const supportsRelAR = (() => {
      try { return document.createElement('a').relList.supports('ar'); } catch (_) { return false; }
    })();
    const isIOSInAppBrowser = isIOS && (!supportsRelAR || !/Safari\//i.test(ua) || /Twitter|X-iOS|FBAN|FBAV|Instagram|LinkedInApp|CriOS|FxiOS/i.test(ua));

    if (isIOSInAppBrowser) {
      const hint = document.getElementById('inappHint');
      const hintText = document.getElementById('inappHintText');
      hint.classList.add('show');
      arLabel.textContent = '🧭 Open in Safari for iPhone AR ↗';
      arPill.removeAttribute('rel');
      const safariBreakoutUrl = window.location.href.replace(/^https?:\/\//i, (m) => 'x-safari-' + m.toLowerCase());
      arPill.href = safariBreakoutUrl;
      arPill.addEventListener('click', () => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(window.location.href).catch(() => {});
        }
        setTimeout(() => {
          hintText.innerHTML = '📋 Link copied! Tap the <b>🧭 Safari</b> icon (bottom-right) to launch AR.';
        }, 650);
      });
    } else if (isAndroid) {
      arLabel.textContent = '📲 Place on Table in Android AR';
      arPill.removeAttribute('rel');
      arPill.addEventListener('click', (e) => {
        e.preventDefault();
        if (mv.canActivateAR) {
          mv.activateAR();
        } else {
          const glbAbs = new URL('./schloss_aurelia_ar.glb', window.location.href).href;
          const fallback = encodeURIComponent(window.location.href);
          window.location.href = `intent://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(glbAbs)}&mode=ar_preferred&title=Schloss%20Aurelia#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=${fallback};end;`;
        }
      });
    } else if (!isIOS) {
      arLabel.textContent = '📱 Open on Phone for Tabletop AR';
      arPill.removeAttribute('rel');
      arPill.addEventListener('click', (e) => {
        e.preventDefault();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(window.location.href).then(() => {
            arLabel.textContent = '✅ Link Copied — Open on Phone!';
            setTimeout(() => { arLabel.textContent = '📱 Open on Phone for Tabletop AR'; }, 2800);
          });
        }
      });
    }

    chips.forEach((chip) => {
      chip.addEventListener('click', () => {
        chips.forEach((c) => c.classList.remove('active'));
        chip.classList.add('active');
        applyChipCamera(chip);
      });
    });

    btnSpin.addEventListener('click', () => {
      const next = !mv.hasAttribute('auto-rotate');
      if (next) {
        mv.setAttribute('auto-rotate', '');
      } else {
        mv.removeAttribute('auto-rotate');
      }
      btnSpin.classList.toggle('on', next);
    });

    let playing = true;
    btnAnim.addEventListener('click', () => {
      playing = !playing;
      if (playing) {
        mv.play();
      } else {
        mv.pause();
      }
      btnAnim.classList.toggle('on', playing);
    });
  </script>
</body>
</html>
